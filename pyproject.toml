[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "didi-merging"
version = "0.1.0"
description = "Core algorithm for slim dynamic model merging"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Guodong Du"},
  {name = "Wanyu Lin"},
]
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["didi_merging*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
